@extends("/_layouts/admin.html")

@section("editor-css")
<!-- 編集画面とエディタ内要素のスタイルを読み込み。
  ブロックエディターのプレビュー（隔離 iframe）にも同じスタイルを入れるため data-block-editor-stylesheet を付ける。
  admin.js から import すると、JS エントリーに付随する link には属性を付けられないため CSS 単体のエントリーにしている -->
@vite("src/style/editor.css", {
  "linkTagAttributes": {
    "data-block-editor-stylesheet": true
  }
})
@endsection

@section("admin-js")
@parent

<script>
  ACMS.Ready(function() {
    // 公開側の本文（include/entry/body.twig）と同じクラスにする。max-w-none が無いと prose の max-width: 65ch で
    // ブロックエディターのプレビュー（隔離 iframe）の本文幅が狭まり、公開側と見た目が変わる
    ACMS.Config.blockEditorConfig.editorProps.editorProps.attributes.class = 'prose max-w-none';
  });
</script>
<!-- カスタムJSを記述 -->
@vite("src/js/admin.js", {
  "scriptTagAttributes": {
    "async": true
  }
})
@endsection
