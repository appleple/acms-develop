name: Test

# ルート（release パッケージング）と themes/develop（Lint・Vite build）の両方を検証する。
# Dependabot の patch/minor 自動マージ（dependabot-auto-merge.yml）が待つ必須チェック。

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'fix/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint theme
        run: npm --prefix themes/develop run lint

      - name: Build release package
        run: npm run package
